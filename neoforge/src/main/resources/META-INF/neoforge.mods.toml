license = "${mod_license}"
issueTrackerURL = "${source}/issues"

[[mods]]
    modId = "${mod_id}"
    version = "${version}"
    displayName = "${mod_name}"
    updateJSONURL = "${update_url}"
    displayURL = "${curseforge_page}"
    logoFile = "${logo_file}"
    authors = "${mod_author}"
    description = '''${mod_description}'''

[[dependencies.${mod_id}]]
    modId = "neoforge"
    type = "required"
    mandatory = true
    versionRange = "${neoforge_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "minecraft"
    type = "required"
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "forgeconfigapiport"
    type = "optional"
    versionRange = "[0,)"
    ordering = "BEFORE"
    side = "BOTH"