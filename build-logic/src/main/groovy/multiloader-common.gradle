//file:noinspection SpellCheckingInspection
plugins {
    id 'java-library'
    id 'maven-publish'
}

base {
    archivesName = "${mod_id}-${project.name}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
}

repositories {
    mavenCentral()
    // https://docs.gradle.org/current/userguide/declaring_repositories.html#declaring_content_exclusively_found_in_one_repository
    exclusiveContent {
        forRepository {
            maven {
                name = 'Sponge'
                url = 'https://repo.spongepowered.org/repository/maven-public'
            }
        }
        filter { includeGroupAndSubgroups('org.spongepowered') }
    }
    exclusiveContent {
        forRepositories(
                maven {
                    name = 'ParchmentMC'
                    url = 'https://maven.parchmentmc.org/'
                },
                maven {
                    name = "NeoForge"
                    url = 'https://maven.neoforged.net/releases'
                }
        )
        filter { includeGroup('org.parchmentmc.data') }
    }
    maven {
        name = 'Forge'
        url = uri('https://maven.minecraftforge.net')
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
    // Forge Config Api Port
    maven {
        name = "Fuzs Mod Resources"
        url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
    }
}

sourcesJar {
    from(rootProject.file("LICENSE.md"))
}

jar {
    from(rootProject.file("LICENSE.md"))

    manifest {
        attributes([
                'Specification-Title'     : mod_name,
                'Specification-Vendor'    : mod_author,
                'Specification-Version'   : project.jar.archiveVersion,
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_author,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'Timestamp'               : System.currentTimeMillis(),
                'Built-On-Java'           : "${System.getProperty('java.vm.version')} (${System.getProperty('java.vm.vendor')})",
                'Built-On-Minecraft'      : minecraft_version
        ])
    }
}

processResources {
    def expandProps = [
            // Project / Minecraft
            "java_version"            : java_version,
            "version"                 : version,
            "group"                   : project.group, // Else we target the task's group.
            "minecraft_version"       : minecraft_version,
            "minecraft_version_range" : minecraft_version_range,
            "logo_file"               : logo_file,

            // Mappings / Toolchain
            "neo_form_version"        : neo_form_version,

            // Forge
            "forge_version"           : forge_version,
            "forge_version_range"     : forge_version_range,

            // NeoForge
            "neoforge_version"        : neoforge_version,
            "neoforge_version_range"  : neoforge_version_range,

            // Fabric
            "fabric_api_version"      : fabric_api_version,
            "fabric_api_version_range": fabric_api_version_range,
            "fabric_loader_version"   : fabric_loader_version,
            "fabric_mc_version_range" : fabric_mc_version_range,

            // Configuration / UI
            "forgeconfigapi_version"  : forgeconfigapi_version,
            "modmenu_version"         : modmenu_version,

            // Mod Metadata
            "mod_name"                : mod_name,
            "mod_author"              : mod_author,
            "mod_id"                  : mod_id,
            "mod_license"             : mod_license,
            "mod_author_email"        : mod_author_email,
            "mod_description"         : mod_description,

            // Distribution / Project Links
            "curseforge_page"         : curseforge_page,
            "modrinth_page"           : modrinth_page,
            "source"                  : project.source,
            "update_url"              : update_url,
            "homepage"                : homepage,
            "discord"                 : discord
    ]

    var jsonExpandProps = expandProps.collectEntries {
        key, value -> [(key): value instanceof String ? value.replace('\n', '\\\\n') : value]
    }

    filesMatching(['META-INF/mods.toml', 'META-INF/neoforge.mods.toml']) {
        expand expandProps
    }

    filesMatching(['pack.mcmeta', 'fabric.mod.json', '*.mixins.json']) {
        expand jsonExpandProps
    }

    inputs.properties(expandProps)
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId base.archivesName.get()
            from components.java
        }
    }
    repositories {
        maven {
            url System.getenv('local_maven_url')
        }
    }
}