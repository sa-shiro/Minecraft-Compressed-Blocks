//file:noinspection SpellCheckingInspection

plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}

repositories {
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // Forge Config API Port - Fabric
    implementation("fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forgeconfigapi_version}")

    // Mod Menu - Prior to Minecraft 26.x, use "modImplementation" instead (removed for: 26.3)
    //implementation("com.terraformersmc:modmenu:${project.modmenu_version}")
}

afterEvaluate {
    loom.runConfigs.named("datagen") {
        runDirectory = file("runs/datagen")
    }
}

loom {
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(false)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(false)
            runDir('runs/server')
        }
    }
}

fabricApi {
    configureDataGeneration() {
        client = true
    }
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}