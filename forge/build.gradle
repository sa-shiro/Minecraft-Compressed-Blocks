//file:noinspection SpellCheckingInspection

plugins {
    id 'multiloader-loader'
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
    id 'idea'
}

repositories {
    maven {
        name = 'Forge'
        url = uri('https://maven.minecraftforge.net')
    }
    minecraft.mavenizer(it) // In Kotlin, it = this
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.6'
}

base {
    archivesName = "${mod_name}-forge-${minecraft_version}"
}

minecraft {
    runs {
        register('client') {
            workingDir = layout.projectDirectory.dir('runs/client')
        }

        register('server') {
            workingDir = layout.projectDirectory.dir('runs/server')
            args '--nogui'
        }
    }
}

sourceSets.main.resources { srcDir '../fabric/src/main/generated' }
